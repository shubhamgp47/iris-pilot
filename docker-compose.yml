services:
  db:
    image: postgis/postgis:16-3.4
    container_name: iris_db
    restart: always
    environment:
      POSTGRES_DB: iris_pilot
      POSTGRES_USER: iris_user
      POSTGRES_PASSWORD: iris_password
    ports:
      - "5432:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris_user -d iris_pilot"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  iris_pgdata: