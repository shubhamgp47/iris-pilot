[project]
name = "iris-pilot"
version = "0.1.0"
description = "Project IRIS: Canonical PostGIS Pilot Schema & Prospecting Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1.18",
    "shapely>=2.0.3",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]